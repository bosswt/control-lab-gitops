apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-dex-github
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: argocd-dex-github
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: clientSecret
      remoteRef:
        key: argocd-dex
        property: clientSecret