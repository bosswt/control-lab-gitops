apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-credentials
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: github-credentials
    template:
      data:
        credentials: '{"token":"{{ .token }}","owner":"bosswt-control-lab"}'
  data:
    - secretKey: token
      remoteRef:
        key: crossplane-github
        property: token