apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: crossplane-system
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: lab
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: crossplane-eso
          serviceAccountRef:
            name: crossplane-vault