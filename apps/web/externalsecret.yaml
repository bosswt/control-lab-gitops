apiVersion: external-secrets.io/v1alpha1
kind: ExternalSecret
metadata:
  name: web-greeting
  namespace: lab
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: web-greeting
  data:
    - secretKey: GREETING
      remoteRef:
        key: web
        property: greeting